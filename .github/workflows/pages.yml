name: pages
# Publishes the Element10 web app (folder web/) to GitHub Pages. Needs: repo public (free plan) and
# Settings -> Pages -> Source = "GitHub Actions". Tests run first; a failing test blocks the deploy.
on:
  push: { branches: [main], paths: ["web/**"] }
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node --test web/tests/calc.test.js web/tests/data.test.js
      - run: rm -rf web/tests
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: d
        uses: actions/deploy-pages@v4
